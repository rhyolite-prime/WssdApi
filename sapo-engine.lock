# Pinned Sapo Engine version — the single source of truth for both CMake and CI.
#
# CI clones SapoEngine, builds it and installs it into vendor/sapo. This file
# records which engine version WssdApi expects to find there.
#
#   * CMake reads it to require that exact version from any prebuilt prefix
#     (find_package(SapoEngine <version> EXACT)), so a stale or hand-built tree
#     fails loudly instead of silently changing engine behaviour.
#   * the build workflow compares it with the version the engine actually
#     builds and fails early, with a clear message, when they drift apart.
#
# Bumping the engine is therefore a one-line, reviewable change:
#   1. land the engine change on the branch CI builds (SAPO_ENGINE_REF)
#   2. update SAPO_ENGINE_VERSION below to the version it now reports
#   3. commit — CI verifies the two agree before it builds anything
#
# The value must match the artifact tag exactly (no leading "v"): the engine
# reports PACKAGE_VERSION 0.4.0 in SapoEngineConfigVersion.cmake.
SAPO_ENGINE_VERSION=0.4.0
