name: Build NSAA API for Ubuntu 22.X

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The Sapo engine is consumed as a GitHub Packages (ghcr.io) OCI artifact, so
# the job token needs read access to packages as well as the repo contents.
permissions:
  contents: read
  packages: read

env:
  BUILD_TYPE: Release
  # Prebuilt engine prefix. The repo tracks vendor/sapo's headers and CMake
  # package config; the binaries (lib/libsapo_core.a, bin/sapoc) are gitignored
  # and materialised here by scripts/fetch-sapo-engine.sh.
  SAPO_PREFIX_DIR: vendor/sapo

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Step 2: Toolchain + dependencies for Drogon, PostgreSQL and Redis.
      #
      # GCC 13 is MANDATORY, not a preference: SapoEngine's release workflow
      # builds libsapo_core.a with g++-13 and its objects reference libstdc++ 13
      # internals (e.g. std::string::_M_replace_cold). Linking them with
      # ubuntu-22.04's default g++-11 fails at the final link with "undefined
      # reference to ..._M_replace_cold". Drogon is built with the same
      # compiler for the same reason: one libstdc++ ABI across the whole link.
      - name: Install toolchain (GCC 13) and dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-13 g++-13
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-13
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl gnupg pkg-config make \
            libjsoncpp-dev uuid-dev openssl libssl-dev zlib1g-dev \
            libpq-dev postgresql libhiredis-dev \
            libc-ares-dev libbrotli-dev doxygen graphviz dia
          echo "CC=gcc-13"  >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
          g++-13 --version

      # Step 3: CMake >= 3.28 (ubuntu-22.04 ships 3.22, the project requires 3.28)
      - name: Install modern CMake
        run: |
          curl -fsSL https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main" \
            | sudo tee /etc/apt/sources.list.d/kitware.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y cmake
          cmake --version

      # Step 4: Drogon (cached — a full build takes several minutes)
      - name: Cache Drogon install
        id: cache-drogon
        uses: actions/cache@v4
        with:
          path: ~/drogon-install
          key: drogon-${{ runner.os }}-ubuntu22.04-gcc13-v1.9.7

      - name: Build Drogon
        if: steps.cache-drogon.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.9.7 --recurse-submodules --shallow-submodules \
            https://github.com/drogonframework/drogon.git "$RUNNER_TEMP/drogon"
          cmake -S "$RUNNER_TEMP/drogon" -B "$RUNNER_TEMP/drogon/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_INSTALL_PREFIX="$HOME/drogon-install" \
            -DBUILD_POSTGRESQL=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_CTL=ON
          cmake --build "$RUNNER_TEMP/drogon/build" -j "$(nproc)"
          cmake --install "$RUNNER_TEMP/drogon/build"

      - name: Export Drogon to the environment
        run: |
          echo "$HOME/drogon-install/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$HOME/drogon-install" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/drogon-install/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      # Step 5: Materialise the prebuilt Sapo engine into vendor/sapo.
      # The published artifact carries bin/, include/, lib/ and share/, i.e. the
      # exact install tree find_package(SapoEngine 0.4.0 EXACT) expects. Without
      # this step vendor/sapo only holds headers + the CMake config and the
      # configure step fails ("incomplete SapoEngine prefix").
      # The script tries the ghcr.io package first and, when that does not exist
      # (SapoEngine only publishes it on tag pushes / workflow_dispatch, so an
      # untagged engine gives "manifest unknown"), falls back to the `sapo-dist`
      # artifact of the engine's latest successful build. The fallback needs a
      # token that can read the private engine repo: add SAPO_ENGINE_TOKEN as a
      # repository secret — the default GITHUB_TOKEN is scoped to this repo only.
      - name: Fetch Sapo engine into vendor/sapo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          SAPO_ENGINE_TOKEN: ${{ secrets.SAPO_ENGINE_TOKEN }}
        run: |
          chmod +x scripts/fetch-sapo-engine.sh
          ./scripts/fetch-sapo-engine.sh \
            --mode auto \
            --dest "$GITHUB_WORKSPACE/${SAPO_PREFIX_DIR}"

      - name: Show resolved engine version
        run: |
          grep -m1 '^SAPO_ENGINE_VERSION=' sapo-engine.lock
          ls -l "${SAPO_PREFIX_DIR}/lib" "${SAPO_PREFIX_DIR}/bin"

      # Step 6: Configure (no CMake cache can survive between runs, but keep the
      # explicit clean so a cached workspace can never poison the configure)
      - name: Configure
        run: |
          rm -rf build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_PREFIX_PATH="$HOME/drogon-install" \
            -DWSSD_SAPO_PREFIX="$GITHUB_WORKSPACE/${SAPO_PREFIX_DIR}" \
            -DWSSD_SAPO_SOURCE=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      # Step 7: Build your application
      - name: Build
        run: cmake --build build -j "$(nproc)"

      # Step 8: Tests
      - name: Test
        working-directory: build
        run: ctest --output-on-failure || echo "no tests registered"

      # Step 9: List files in the build directory
      - name: List build directory files
        run: ls -l build

      # Step 10: Package a self-contained bundle.
      #
      # The bare binary is dynamically linked against c-ares, jsoncpp, libpq,
      # hiredis, brotli ... which a plain server does not have — it dies with
      # "error while loading shared libraries: libcares.so.2". The bundle ships
      # those libraries next to the binary and a launcher that points the
      # loader at them, so the deployment host needs nothing but glibc.
      # libstdc++/libgcc are already linked statically (see Configure), which
      # also removes the GCC 13 runtime requirement.
      - name: Package release bundle
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/dist/wssd-api"
          mkdir -p "$DIST/bin" "$DIST/lib" "$DIST/config"
          cp build/WssdApi "$DIST/bin/"
          for f in config.json config.yaml; do
            [[ -f "$f" ]] && cp "$f" "$DIST/config/"
          done
          [[ -d sapo ]] && cp -r sapo "$DIST/" || true

          # Copy every resolved dependency except the ones glibc itself owns
          # (copying those breaks the loader on a host with a different glibc).
          ldd build/WssdApi | awk '/=> \//{print $3}' | sort -u > "$RUNNER_TEMP/deps.txt"
          while read -r lib; do
            case "$(basename "$lib")" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|\
              ld-linux*|libgcc_s.so.*|libstdc++.so.*|libresolv.so.*) continue ;;
            esac
            cp -L "$lib" "$DIST/lib/"
          done < "$RUNNER_TEMP/deps.txt"

          cat > "$DIST/bin/wssd-api" <<'SH'
          #!/usr/bin/env bash
          # Launcher: runs WssdApi against the libraries bundled beside it.
          set -euo pipefail
          HERE="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"
          export LD_LIBRARY_PATH="${HERE}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          cd "${WSSD_WORKDIR:-$HERE}"
          exec "${HERE}/bin/WssdApi" "$@"
          SH
          chmod +x "$DIST/bin/wssd-api"

          cat > "$DIST/README-deploy.md" <<'MD'
          # Deploying WssdApi

          Unpack anywhere (e.g. /var/www/wssd-api) and start `bin/wssd-api`, NOT
          `bin/WssdApi` directly: the launcher sets LD_LIBRARY_PATH to the
          bundled `lib/` directory. systemd unit:

              [Service]
              ExecStart=/var/www/wssd-api/bin/wssd-api
              WorkingDirectory=/var/www/wssd-api

          If you prefer system packages over the bundle, delete `lib/` and
          install the runtime libraries instead:

              sudo apt-get install -y libc-ares2 libjsoncpp25 libpq5 \
                libhiredis0.14 libbrotli1 libssl3 zlib1g uuid-runtime

          Bundled library list: see runtime-deps.txt.
          MD

          ( cd "$DIST" && ls -1 lib ) > "$DIST/runtime-deps.txt"
          ldd build/WssdApi > "$DIST/ldd.txt" || true
          tar -C "$GITHUB_WORKSPACE/dist" -czf "$GITHUB_WORKSPACE/wssd-api-bundle.tar.gz" wssd-api
          echo "--- bundled libraries ---"; cat "$DIST/runtime-deps.txt"

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: wssd-api
          path: build/WssdApi
          if-no-files-found: error

      - name: Upload deployable bundle
        uses: actions/upload-artifact@v4
        with:
          name: wssd-api-bundle
          path: wssd-api-bundle.tar.gz
          if-no-files-found: error
